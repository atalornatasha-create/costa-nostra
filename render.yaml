services:
  - type: web
    name: cosa-nostra
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: INVITE_CODES
        sync: false
      - key: PHASE_MS
        value: "90000"
      - key: NATASHA_ADMIN_EMAIL
        sync: false
      - key: NATASHA_ADMIN_PASSWORD
        sync: false
      - key: NATASHA_ADMIN_NAME
        value: "Natasha"
      - key: NATASHA_ADMIN_INSTAGRAM
        sync: false
      - key: NATASHA_ADMIN_FACEBOOK
        sync: false
      - key: NATASHA_ADMIN_TIKTOK
        sync: false
      - key: NATASHA_ADMIN_X
        sync: false
      - key: PEACE_ADMIN_EMAIL
        sync: false
      - key: PEACE_ADMIN_PASSWORD
        sync: false
      - key: PEACE_ADMIN_NAME
        value: "Peace"
      - key: PEACE_ADMIN_INSTAGRAM
        sync: false
      - key: PEACE_ADMIN_FACEBOOK
        sync: false
      - key: PEACE_ADMIN_TIKTOK
        sync: false
      - key: PEACE_ADMIN_X
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_URL
        sync: false
